<body class="font-body min-h-screen dot-bg">
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback}=React;
const delay=ms=>new Promise(r=>setTimeout(r,ms));

/* ===== API LAYER =====
   Same-origin FastAPI backend (api.py). Empty base = relative paths, which
   works whether this page is served by uvicorn directly (mounted at "/")
   or from a different static host pointed at the same API via window.API_BASE. */
const API_BASE = (typeof window!=='undefined'&&window.API_BASE)||'';

async function apiRequest(path,options){
  let res;
  try{
    res=await fetch(`${API_BASE}${path}`,{credentials:'include',...options});
  }catch(networkErr){
    throw new Error('Cannot reach the Nagarik Mitra API. Is the server running?');
  }
  if(!res.ok){
    let detail=res.statusText;
    try{const body=await res.json();if(body&&body.detail)detail=body.detail;}catch(_){}
    throw new Error(detail);
  }
  return res.json();
}
const jsonPost=(path,payload)=>apiRequest(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
const apiHealth=()=>apiRequest('/health');
const apiPredict=payload=>jsonPost('/predict',payload);
const apiListTickets=()=>apiRequest('/tickets');
const apiMyTickets=()=>apiRequest('/my-tickets');
const apiUpdateStatus=(id,status)=>apiRequest(`/tickets/${id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});
// Auth (nagrikmitra/auth.py, auth_routes.py) — cookie session, same-origin.
const apiAuthConfig=()=>apiRequest('/auth/config');
const apiMe=()=>apiRequest('/auth/me');
const apiRegister=payload=>jsonPost('/auth/register',payload);
const apiLogin=payload=>jsonPost('/auth/login',payload);
const apiLogout=()=>apiRequest('/auth/logout',{method:'POST'});

/* ===== TAXONOMY (mirrors config/taxonomy.yaml) ===== */
const OTHER_DOMAIN='Other / Unknown';
const STATUS_OPTIONS=['New','In Progress','Resolved'];

const domainMeta={
  Roads:{icon:'fa-road',bg:'bg-blue-100',text:'text-blue-700',chart:'#3B82F6',short:'PWD'},
  Lights:{icon:'fa-lightbulb',bg:'bg-amber-100',text:'text-amber-700',chart:'#F59E0B',short:'Municipal Corp.'},
  Water:{icon:'fa-droplet',bg:'bg-cyan-100',text:'text-cyan-700',chart:'#06B6D4',short:'Jal Board'},
  Waste:{icon:'fa-trash-can',bg:'bg-purple-100',text:'text-purple-700',chart:'#8B5CF6',short:'SWM Dept.'},
  Sanitation:{icon:'fa-faucet-drip',bg:'bg-gray-200',text:'text-gray-700',chart:'#6B7280',short:'Sewerage Board'},
  Electricity:{icon:'fa-bolt',bg:'bg-red-100',text:'text-red-700',chart:'#EF4444',short:'Discom'},
  Health:{icon:'fa-heart-pulse',bg:'bg-emerald-100',text:'text-emerald-700',chart:'#10B981',short:'Health Dept.'},
  [OTHER_DOMAIN]:{icon:'fa-circle-question',bg:'bg-slate-200',text:'text-slate-700',chart:'#94A3B8',short:'Human review'}
};
const priorityMeta={
  Low:{bg:'bg-green-100',text:'text-green-700'},
  Medium:{bg:'bg-amber-100',text:'text-amber-700'},
  High:{bg:'bg-red-100',text:'text-red-700'}
};
// API returns language as a code (hi/en/hinglish/other); map to display labels.
const langDisplay={hi:'Hindi',en:'English',hinglish:'Hinglish',other:'Other'};
const langMeta={
  Hindi:{bg:'bg-orange-100',text:'text-orange-700'},
  English:{bg:'bg-sky-100',text:'text-sky-700'},
  Hinglish:{bg:'bg-violet-100',text:'text-violet-700'},
  Other:{bg:'bg-gray-100',text:'text-gray-600'}
};
const statusMeta={
  'New':{bg:'bg-blue-100',text:'text-blue-700'},
  'In Progress':{bg:'bg-amber-100',text:'text-amber-700'},
  'Resolved':{bg:'bg-green-100',text:'text-green-700'}
};

/* ===== HELPERS ===== */
// created_at/due_at come from Python's datetime.utcnow().isoformat() — naive
// UTC with no "Z" suffix. Append it before parsing so the browser treats it
// as UTC instead of local time.
function parseUTC(iso){
  if(!iso)return null;
  const d=new Date(iso.endsWith('Z')?iso:iso+'Z');
  return isNaN(d.getTime())?null:d;
}
function timeAgo(iso){
  const d=parseUTC(iso);
  if(!d)return'—';
  const s=Math.floor((Date.now()-d.getTime())/1000);
  if(s<60)return'Just now';
  const m=Math.floor(s/60);if(m<60)return m+'m ago';
  const h=Math.floor(m/60);if(h<24)return h+'h ago';
  const dd=Math.floor(h/24);return dd+'d ago';
}
function greeting(){
  const h=new Date().getHours();
  return h<12?'Good morning':h<17?'Good afternoon':'Good evening';
}
// Chart.js draws to canvas, so its colors can't be reached by the CSS
// html.dark overrides — components that render a chart read this to pick
// theme-appropriate colors themselves, and rebuild when it flips.
function useIsDark(){
  const[dark,setDark]=useState(()=>document.documentElement.classList.contains('dark'));
  useEffect(()=>{
    const el=document.documentElement;
    const obs=new MutationObserver(()=>setDark(el.classList.contains('dark')));
    obs.observe(el,{attributes:true,attributeFilter:['class']});
    return()=>obs.disconnect();
  },[]);
  return dark;
}
function slaRemaining(c){
  if(c.status==='Resolved')return{text:'Resolved',expired:false};
  const due=parseUTC(c.due_at);
  if(!due)return{text:'—',expired:false};
  const rem=due.getTime()-Date.now();
  if(rem<=0)return{text:'Expired',expired:true};
  const h=Math.floor(rem/3600000),m=Math.floor((rem%3600000)/60000);
  return{text:h+'h '+m+'m',expired:false};
}

/* ===== SHARED FORM STYLES ===== */
const inputCls='w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-saffron-200 focus:border-saffron-500 outline-none transition bg-white text-gray-800 placeholder-gray-400 disabled:opacity-50';
const labelCls='block text-sm font-semibold text-gray-700 mb-1.5';

/* ===== SMALL COMPONENTS ===== */
function Badge({label,meta}){
  const m=meta||langMeta.Other;
  return<span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold ${m.bg} ${m.text}`}>{label}</span>;
}

function Toast({message,visible,tone}){
  const isError=tone==='error';
  return<div className={`fixed top-5 right-5 z-50 transition-all duration-500 max-w-sm ${visible?'translate-x-0 opacity-100':'translate-x-8 opacity-0 pointer-events-none'}`}>
    <div className={`${isError?'bg-red-600':'bg-civic-green'} text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-2 font-medium text-sm`}>
      <i className={`fas ${isError?'fa-triangle-exclamation':'fa-circle-check'}`}></i>{message}
    </div>
  </div>;
}

function ErrorBanner({message}){
  if(!message)return null;
  return<div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl px-4 py-3 flex items-center gap-2">
    <i className="fas fa-triangle-exclamation flex-shrink-0"></i><span>{message}</span>
  </div>;
}

/* ===== PIPELINE ANIMATION =====
   The classification itself is one round-trip to POST /predict (sklearn
   TF-IDF + Logistic Regression, per README). Steps below stagger the
   REAL response fields into view for legibility, they don't re-run
   separate models client-side. */
const pipeSteps=[
  {icon:'fa-globe',label:'Language Detection',model:'Script + Lexicon Detector',key:'language'},
  {icon:'fa-align-left',label:'Text Normalization',model:'Rule-based Cleaner',key:'normalized'},
  {icon:'fa-tags',label:'Domain Classification',model:'TF-IDF + LogisticRegression',key:'domain'},
  {icon:'fa-gauge-high',label:'Priority Scoring',model:'TF-IDF + LogisticRegression',key:'priority'},
  {icon:'fa-route',label:'Dept. Routing',model:'Taxonomy Lookup',key:'department'}
];

function ConnectorLine({active}){
  return<div className="flex-shrink-0 w-8 md:w-14 h-0.5 mt-5 rounded bg-gray-200 relative overflow-hidden">
    {active&&<div className="absolute inset-0 bg-gradient-to-r from-saffron-500 to-civic-green anim-fill-line rounded"></div>}
  </div>;
}

function PipelineStep({step,idx,currentStep,result}){
  const st=idx<currentStep?'complete':idx===currentStep?'active':'pending';
  const ring=st==='active'?'border-saffron-500 anim-pulse-glow shadow-lg':st==='complete'?'border-civic-green bg-civic-green-light':'border-gray-200 bg-gray-50 opacity-50';
  const iconColor=st==='complete'?'text-civic-green':st==='active'?'text-saffron-500':'text-gray-400';
  const iconBg=st==='complete'?'bg-civic-green/10':st==='active'?'bg-saffron-50':'bg-gray-100';
  return<div className={`flex-shrink-0 w-32 md:w-40 p-3 rounded-xl border-2 transition-all duration-500 ${ring}`}>
    <div className="flex items-center justify-center mb-1.5">
      <div className={`w-8 h-8 rounded-full flex items-center justify-center ${iconBg} transition-colors duration-500`}>
        {st==='complete'?<i className="fas fa-check text-sm"></i>:<i className={`fas ${step.icon} text-sm ${iconColor}`}></i>}
      </div>
    </div>
    <p className="text-[11px] font-bold text-navy-800 text-center leading-tight mb-0.5">{step.label}</p>
    <p className="text-[9px] text-gray-400 text-center mb-2">{step.model}</p>
    {result!==undefined&&<div className="bg-white/70 rounded-lg p-1.5 anim-fade-in">
      <p className="text-[11px] font-semibold text-navy-700 text-center leading-snug break-words">{result}</p>
    </div>}
  </div>;
}

function PipelineView({step,results}){
  return<div className="anim-slide-up">
    <div className="flex items-center gap-2 mb-4">
      <i className="fas fa-microchip text-saffron-500"></i>
      <h3 className="font-display font-bold text-navy-800">Classification Pipeline</h3>
    </div>
    <div className="h-1.5 bg-gray-200 rounded-full overflow-hidden mb-6">
      <div className="h-full bg-gradient-to-r from-saffron-500 via-amber-400 to-civic-green rounded-full transition-all duration-700 ease-out" style={{width:`${Math.min((step/5)*100,100)}%`}}></div>
    </div>
    <div className="overflow-x-auto pb-4 -mx-2 px-2">
      <div className="flex items-start justify-between min-w-[740px] gap-0">
        {pipeSteps.map((s,i)=><React.Fragment key={i}>
          {i>0&&<ConnectorLine active={i<=step}/>}
          <PipelineStep step={s} idx={i} currentStep={step} result={results[s.key]}/>
        </React.Fragment>)}
      </div>
    </div>
  </div>;
}

/* ===== RESULT CARD ===== */
function ProbList({items,color}){
  return<div>{items.map(([label,p],i)=>
    <div key={i} className="flex items-center gap-2 mb-1.5">
      <span className="w-28 truncate text-gray-600">{label}</span>
      <div className="flex-1 h-1.5 bg-gray-200 rounded-full overflow-hidden"><div className="h-full rounded-full" style={{width:`${p*100}%`,background:color}}></div></div>
      <span className="w-10 text-right text-gray-500">{(p*100).toFixed(0)}%</span>
    </div>
  )}</div>;
}

function ResultCard({result,onReset}){
  const dm=domainMeta[result.domain]||domainMeta[OTHER_DOMAIN];
  const pm=priorityMeta[result.priority]||priorityMeta.Medium;
  const langLabel=langDisplay[result.language]||'Other';
  const lm=langMeta[langLabel]||langMeta.Other;
  return<div className="mt-6 bg-white rounded-2xl shadow-lg border border-gray-100 p-6 anim-slide-up">
    <div className="flex items-center gap-3 mb-5">
      <div className="w-10 h-10 rounded-full bg-civic-green/10 flex items-center justify-center"><i className="fas fa-check-circle text-civic-green text-lg"></i></div>
      <div>
        <h3 className="font-display font-bold text-lg text-navy-800">Complaint Classified &amp; Routed</h3>
        <p className="text-sm text-gray-500">{result.ticket_id?`Ticket #${result.ticket_id} logged and assigned to the relevant department`:'Processed, but not saved to the inbox'}</p>
      </div>
    </div>
    {result.needs_human&&<div className="mb-4 bg-amber-50 border border-amber-200 text-amber-800 text-sm rounded-xl px-4 py-3 flex items-center gap-2">
      <i className="fas fa-user-check"></i>Low classifier confidence — this complaint has been flagged for human review.
    </div>}
    <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4">
      {[{l:'Language',v:langLabel,m:lm},{l:'Domain',v:result.domain,m:dm},{l:'Priority',v:result.priority,m:pm},{l:'Department',v:dm.short,m:null},{l:'SLA Target',v:result.sla_hours+'h',m:null}].map((item,i)=>
        <div key={i} className="bg-gray-50 rounded-xl p-3 text-center">
          <p className="text-[10px] uppercase tracking-wider text-gray-400 font-semibold mb-1">{item.l}</p>
          {item.m?<Badge label={item.v} meta={item.m}/>:<p className="text-sm font-bold text-navy-800">{item.v}</p>}
        </div>
      )}
    </div>
    <div className="bg-navy-50 rounded-xl p-3 mb-4">
      <div className="flex items-center gap-2 mb-1"><span className="text-[10px] uppercase tracking-wider text-gray-400 font-semibold">Confidence Score</span>
        <div className="flex-1 h-1.5 bg-gray-200 rounded-full overflow-hidden"><div className="h-full rounded-full" style={{width:`${result.confidence*100}%`,background:result.confidence>.8?'#1B7A6E':result.confidence>.6?'#F59E0B':'#EF4444'}}></div></div>
        <span className="text-xs font-bold text-navy-800">{(result.confidence*100).toFixed(0)}%</span>
      </div>

const submitFeatures=[
  {icon:'fa-bolt',title:'Simple & Fast',desc:'File a complaint in seconds'},
  {icon:'fa-bullseye',title:'Tracked & Transparent',desc:'Get updates on progress'},
  {icon:'fa-people-group',title:'Stronger Communities',desc:'Together for a better tomorrow'}
];
function SubmitView({user,onSubmitted,onNavigate}){
  const[text,setText]=useState('');
  const[name,setName]=useState('');
  const[loc,setLoc]=useState('');
  const[useLlm,setUseLlm]=useState(false);
  const[pipeState,setPipeState]=useState('idle');
  const[pipeStep,setPipeStep]=useState(0);
  const[pipeResults,setPipeResults]=useState({});
  const[result,setResult]=useState(null);
  const[toast,setToast]=useState(false);
  const[errorMsg,setErrorMsg]=useState(null);

  const reset=()=>{setText('');setName('');setLoc('');setPipeState('idle');setPipeStep(0);setPipeResults({});setResult(null);setErrorMsg(null);};

  const handleSubmit=async e=>{
    e.preventDefault();
    setErrorMsg(null);
    setPipeState('running');setPipeStep(0);setPipeResults({});setResult(null);

    let api;
    try{
      api=await apiPredict({text,name:user?user.full_name:name,location:loc,channel:'web',persist:true,use_llm:useLlm});
    }catch(err){
      setPipeState('idle');setPipeStep(0);setPipeResults({});
      setErrorMsg(err.message||'Something went wrong contacting the API.');
      return;
    }

    await delay(500);
    setPipeResults(p=>({...p,language:langDisplay[api.language]||api.language}));setPipeStep(1);

    await delay(500);
    const norm=api.normalized_text||'';
    setPipeResults(p=>({...p,normalized:norm.length>60?norm.slice(0,60)+'...':norm}));setPipeStep(2);

    await delay(500);
    const domainConf=api.domain_top3&&api.domain_top3.length?api.domain_top3[0][1]:api.confidence;
    const domainLabel=api.needs_human?`${api.domain} (review)`:`${api.domain} (${Math.round(domainConf*100)}%)`;
    setPipeResults(p=>({...p,domain:domainLabel}));setPipeStep(3);

    await delay(500);
    setPipeResults(p=>({...p,priority:`${api.priority} · ${api.sla_hours}h SLA`}));setPipeStep(4);

    await delay(500);
    const dm=domainMeta[api.domain]||domainMeta[OTHER_DOMAIN];
    setPipeResults(p=>({...p,department:dm.short}));setPipeStep(5);

    await delay(300);
    setResult(api);setPipeState('complete');
    setToast(true);setTimeout(()=>setToast(false),3000);
    onSubmitted();
  };

  return<div className="max-w-6xl mx-auto">
    <Toast message="Complaint submitted and routed successfully!" visible={toast}/>
    <div className="grid lg:grid-cols-[320px_1fr] gap-8 items-start">
      <div className="hidden lg:block space-y-6 sticky top-24">
        <div>
          <div className="flex items-center gap-2 mb-3"><span className="w-8 h-px bg-saffron-500"></span><span className="text-[10px] font-bold tracking-[0.2em] text-gray-400">REPORT · TRACK · RESOLVE</span></div>
          <h2 className="font-display text-4xl font-extrabold text-navy-800 leading-[1.05] mb-3 tracking-tight">A Cleaner, Safer<br/><span className="text-saffron-500">Better Tomorrow</span></h2>
          <p className="text-sm text-gray-500 leading-relaxed">Report civic issues in your area and help us build a better city for everyone.</p>
        </div>
        <div className="space-y-3">
          {submitFeatures.map((f,i)=><div key={i} className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-lg bg-saffron-50 flex items-center justify-center flex-shrink-0"><i className={`fas ${f.icon} text-saffron-500 text-sm`}></i></div>
            <div><p className="text-sm font-bold text-navy-800">{f.title}</p><p className="text-xs text-gray-500">{f.desc}</p></div>
          </div>)}
        </div>
        <blockquote className="border-l-2 border-saffron-500 pl-4 text-sm text-gray-500 italic">
          "Clean cities are built not by governments alone, but by citizens who care."
          <footer className="mt-1 not-italic text-xs text-gray-400">— A Cleaner, Healthier, Happier India</footer>
        </blockquote>
      </div>
      <div className="space-y-6">
    {errorMsg&&<ErrorBanner message={errorMsg}/>}
    <form onSubmit={handleSubmit} className="bg-white rounded-2xl shadow-lg p-6 border border-gray-100">
      <div className="flex items-center gap-3 mb-4">
        <div className="w-10 h-10 rounded-xl bg-saffron-50 flex items-center justify-center"><i className="fas fa-comment-dots text-saffron-500"></i></div>
        <div><h2 className="font-display font-bold text-xl text-navy-800">File a Complaint</h2><p className="text-sm text-gray-500">Type in Hindi, English, or Hinglish — the classifier handles the rest</p></div>
      </div>
      {!user&&<div className="mb-4 bg-saffron-50 border border-saffron-100 text-saffron-700 text-xs rounded-xl px-4 py-2.5 flex items-center gap-2">
        <i className="fas fa-circle-info flex-shrink-0"></i>
        <span>Filing as a guest — that's fine, but <button type="button" onClick={()=>onNavigate('login')} className="underline font-semibold">signing in</button> lets you track your complaints under "My Complaints" later.</span>
      </div>}
      <div className="space-y-4">
        <div>
          <label className="block text-sm font-semibold text-gray-700 mb-1.5">Complaint Description <span className="text-red-400">*</span></label>
          <textarea className="w-full h-36 px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-saffron-200 focus:border-saffron-500 outline-none transition resize-none bg-white text-gray-800 placeholder-gray-400" placeholder="e.g., Mere area mein sadak bahut tooti hui hai gadda hai... / The road near my house has big potholes... / मेरे मोहल्ले में पानी नहीं आ रहा..." value={text} onChange={e=>setText(e.target.value)} required disabled={pipeState!=='idle'}/>
          <p className="mt-1 text-xs text-gray-400">Supports Devanagari script, English, and Romanized Hindi (Hinglish)</p>
        </div>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label className="block text-sm font-semibold text-gray-700 mb-1.5">Your Name</label>
            {user?
              <div className="w-full px-4 py-2.5 border-2 border-gray-100 rounded-xl bg-gray-50 text-gray-700 text-sm flex items-center gap-2"><i className="fas fa-circle-check text-civic-green"></i>{user.full_name}<span className="text-gray-400">(signed in)</span></div>
              :<input type="text" className={inputCls} placeholder="Enter your name" value={name} onChange={e=>setName(e.target.value)} disabled={pipeState!=='idle'}/>}
          </div>
          <div><label className="block text-sm font-semibold text-gray-700 mb-1.5">Location</label><input type="text" className={inputCls} placeholder="e.g., Sector 15, Lucknow" value={loc} onChange={e=>setLoc(e.target.value)} disabled={pipeState!=='idle'}/></div>
        </div>
        <label className="flex items-center gap-2 text-sm text-gray-600 select-none">
          <input type="checkbox" className="rounded border-gray-300 text-saffron-500 focus:ring-saffron-400" checked={useLlm} onChange={e=>setUseLlm(e.target.checked)} disabled={pipeState!=='idle'}/>
          Ask AI to polish the acknowledgment reply (optional — falls back to the template if unavailable)
        </label>
        <button type="submit" disabled={!text.trim()||pipeState!=='idle'} className="w-full py-3.5 bg-navy-800 text-white font-display font-bold rounded-xl hover:bg-navy-700 disabled:bg-gray-200 disabled:text-gray-400 disabled:hover:bg-gray-200 disabled:cursor-not-allowed transition-all flex items-center justify-center gap-2 text-sm">
          {pipeState==='idle'?<><i className="fas fa-paper-plane"></i>Submit &amp; Classify Complaint</>:<><i className="fas fa-spinner" style={{animation:'spin 1s linear infinite'}}></i>Processing through classification pipeline...</>}
        </button>
      </div>
    </form>
    {(pipeState==='running'||pipeState==='complete')&&<div className="bg-white rounded-2xl shadow-lg p-6 border border-gray-100"><PipelineView step={pipeStep} results={pipeResults}/></div>}
    {result&&<ResultCard result={result} onReset={reset}/>}
    <details className="bg-white rounded-xl border border-gray-100 overflow-hidden shadow-sm group">
      <summary className="px-5 py-3.5 cursor-pointer text-sm font-semibold text-navy-800 hover:bg-gray-50 transition flex items-center gap-2">
        <i className="fas fa-circle-info text-saffron-500"></i>How does the classification pipeline work?
        <i className="fas fa-chevron-down text-gray-400 ml-auto transition-transform group-open:rotate-180 text-xs"></i>
      </summary>
      <div className="px-5 pb-5 text-sm text-gray-600 space-y-3 border-t border-gray-100 pt-4">
        <div className="flex gap-3"><span className="flex-shrink-0 w-6 h-6 rounded-full bg-saffron-50 text-saffron-600 flex items-center justify-center text-xs font-bold">1</span><div><strong className="text-navy-800">Language Detection</strong> — Devanagari-script detection plus a romanized-Hindi (Hinglish) lexicon match identifies Hindi, English, or Hinglish input.</div></div>
        <div className="flex gap-3"><span className="flex-shrink-0 w-6 h-6 rounded-full bg-saffron-50 text-saffron-600 flex items-center justify-center text-xs font-bold">2</span><div><strong className="text-navy-800">Text Normalization</strong> — Unicode NFC normalization, URL/noise stripping, and whitespace cleanup, preserving Devanagari and Latin signal.</div></div>
        <div className="flex gap-3"><span className="flex-shrink-0 w-6 h-6 rounded-full bg-saffron-50 text-saffron-600 flex items-center justify-center text-xs font-bold">3</span><div><strong className="text-navy-800">Domain Classification</strong> — A TF-IDF (1–2 gram) + Logistic Regression model categorizes the complaint into one of 7 civic domains, or "Other / Unknown" when confidence is too low.</div></div>
        <div className="flex gap-3"><span className="flex-shrink-0 w-6 h-6 rounded-full bg-saffron-50 text-saffron-600 flex items-center justify-center text-xs font-bold">4</span><div><strong className="text-navy-800">Priority Scoring</strong> — A second TF-IDF + Logistic Regression head assigns Low / Medium / High priority with a fixed SLA (48h / 168h / 336h).</div></div>
        <div className="flex gap-3"><span className="flex-shrink-0 w-6 h-6 rounded-full bg-saffron-50 text-saffron-600 flex items-center justify-center text-xs font-bold">5</span><div><strong className="text-navy-800">Department Routing</strong> — A frozen taxonomy lookup (<code>config/taxonomy.yaml</code>) maps the classified domain to its municipal department.</div></div>
      </div>
    </details>
      </div>
    </div>
  </div>;
}

/* ===== DASHBOARD ===== */
function StatCard({icon,label,value,color,sub}){
  const cm={blue:'bg-blue-50 text-blue-600',red:'bg-red-50 text-red-600',amber:'bg-amber-50 text-amber-600',green:'bg-green-50 text-green-600',navy:'bg-navy-50 text-navy-600'};
  return<div className="bg-white rounded-xl p-5 shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
    <div className="flex items-start justify-between"><div><p className="text-sm text-gray-500 font-medium">{label}</p><p className="text-3xl font-display font-extrabold text-navy-800 mt-1">{value}</p>{sub&&<p className="text-xs text-gray-400 mt-1">{sub}</p>}</div><div className={`w-11 h-11 rounded-xl flex items-center justify-center ${cm[color]}`}><i className={`fas ${icon}`}></i></div></div>
  </div>;
}

function DomainChart({data}){
  const ref=useRef(null);const chart=useRef(null);const dark=useIsDark();
  useEffect(()=>{
    if(chart.current)chart.current.destroy();
    const counts={};data.forEach(c=>{counts[c.domain]=(counts[c.domain]||0)+1});
    const labels=Object.keys(counts),vals=Object.values(counts),colors=labels.map(l=>(domainMeta[l]||domainMeta[OTHER_DOMAIN]).chart);
    chart.current=new Chart(ref.current,{type:'doughnut',data:{labels,datasets:[{data:vals,backgroundColor:colors,borderWidth:2,borderColor:dark?'#141f38':'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:10,padding:8,font:{size:10,family:'Noto Sans'},color:dark?'#93a1bc':'#64748b'}}}}});
    return()=>{if(chart.current)chart.current.destroy()};
  },[data,dark]);
  return<div className="bg-white rounded-xl p-5 shadow-sm border border-gray-100"><h3 className="font-display font-bold text-navy-800 mb-4 text-sm">By Domain</h3><div style={{height:220}}><canvas ref={ref}></canvas></div></div>;
}
function PriorityChart({data}){
  const ref=useRef(null);const chart=useRef(null);const dark=useIsDark();
  useEffect(()=>{
    if(chart.current)chart.current.destroy();
    const counts={High:0,Medium:0,Low:0};data.forEach(c=>{if(counts[c.priority]!==undefined)counts[c.priority]++});
    chart.current=new Chart(ref.current,{type:'bar',data:{labels:['High','Medium','Low'],datasets:[{data:[counts.High,counts.Medium,counts.Low],backgroundColor:['#EF4444','#F59E0B','#10B981'],borderRadius:6,barThickness:40}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1,font:{size:10},color:dark?'#7889a8':'#94a3b8'},grid:{color:dark?'rgba(255,255,255,.07)':'#f1f5f9'}},x:{ticks:{font:{size:11,weight:'bold'},color:dark?'#cdd6e5':'#475569'},grid:{display:false}}}}});
    return()=>{if(chart.current)chart.current.destroy()};
  },[data,dark]);
  return<div className="bg-white rounded-xl p-5 shadow-sm border border-gray-100"><h3 className="font-display font-bold text-navy-800 mb-4 text-sm">By Priority</h3><div style={{height:220}}><canvas ref={ref}></canvas></div></div>;
}
function StatusChart({data}){
  const ref=useRef(null);const chart=useRef(null);const dark=useIsDark();
  useEffect(()=>{
    if(chart.current)chart.current.destroy();
    const counts={New:0,'In Progress':0,Resolved:0};data.forEach(c=>{if(counts[c.status]!==undefined)counts[c.status]++});
    chart.current=new Chart(ref.current,{type:'doughnut',data:{labels:['New','In Progress','Resolved'],datasets:[{data:[counts.New,counts['In Progress'],counts.Resolved],backgroundColor:['#3B82F6','#F59E0B','#10B981'],borderWidth:2,borderColor:dark?'#141f38':'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:10,padding:8,font:{size:10,family:'Noto Sans'},color:dark?'#93a1bc':'#64748b'}}}}});
    return()=>{if(chart.current)chart.current.destroy()};
  },[data,dark]);
  return<div className="bg-white rounded-xl p-5 shadow-sm border border-gray-100"><h3 className="font-display font-bold text-navy-800 mb-4 text-sm">By Status</h3><div style={{height:220}}><canvas ref={ref}></canvas></div></div>;
}

function DashboardView({user,complaints,loading,onChanged}){

/* ===== MY TICKETS (citizen dashboard) ===== */
function MyStatusDonut({counts}){
  const ref=useRef(null);const chart=useRef(null);const dark=useIsDark();
  const entries=[['Resolved',counts.resolved,'#10B981'],['In Progress',counts.inProgress,'#3B82F6'],['Action Needed',counts.actionNeeded,'#EF4444'],['Others',counts.others,'#94A3B8']];
  useEffect(()=>{
    if(chart.current)chart.current.destroy();
    chart.current=new Chart(ref.current,{type:'doughnut',data:{labels:entries.map(e=>e[0]),datasets:[{data:entries.map(e=>e[1]),backgroundColor:entries.map(e=>e[2]),borderWidth:2,borderColor:dark?'#141f38':'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'72%',plugins:{legend:{display:false}}}});
    return()=>{if(chart.current)chart.current.destroy()};
  },[counts.total,counts.resolved,counts.inProgress,counts.actionNeeded,dark]);
  return<div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
    <h3 className="font-display font-bold text-navy-800 mb-4 flex items-center gap-2"><i className="fas fa-list-check text-saffron-500"></i>Complaint Status</h3>
    <div className="relative mx-auto" style={{height:180,width:180}}>
      <canvas ref={ref}></canvas>
      <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
        <p className="text-2xl font-display font-extrabold text-navy-800">{counts.total}</p>
        <p className="text-[10px] text-gray-400 uppercase tracking-wide">Total</p>
      </div>
    </div>
    <div className="mt-5 space-y-2">
      {entries.map(([l,v,c],i)=><div key={i} className="flex items-center justify-between text-xs">
        <span className="flex items-center gap-2 text-gray-600"><span className="w-2.5 h-2.5 rounded-full" style={{background:c}}></span>{l}</span>
        <span className="font-bold text-navy-800">{v}</span>
      </div>)}
    </div>
  </div>;
}

function LoginPage({googleEnabled,onAuthed,onNavigate}){
  const[role,setRole]=useState('citizen');
  const[identifier,setIdentifier]=useState('');
  const[password,setPassword]=useState('');
  const[officerCode,setOfficerCode]=useState('');
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState(null);

  const handleSubmit=async e=>{
    e.preventDefault();
    setError(null);setLoading(true);
    try{
      const user=await apiLogin({identifier,password});
      onAuthed(user);
    }catch(err){
      setError(err.message||'Login failed.');
    }finally{
      setLoading(false);
    }
  };

  return<AuthCard icon="fa-right-to-bracket" iconBg="bg-navy-800" title="Sign In" subtitle="Access your complaints or the officer inbox">

    <form onSubmit={handleSubmit} className="space-y-4">
      <div><label className={labelCls}>Username or Email</label><input type="text" required value={identifier} onChange={e=>setIdentifier(e.target.value)} disabled={loading} className={inputCls}/></div>
      <div><label className={labelCls}>Password</label><input type="password" required value={password} onChange={e=>setPassword(e.target.value)} disabled={loading} className={inputCls}/></div>

      </div>
      <div>
        <label className={labelCls}>Password</label>
        <input type="password" required minLength={6} value={password} onChange={e=>setPassword(e.target.value)} disabled={loading} className={inputCls}/>
        <p className="mt-1 text-xs text-gray-400">At least 6 characters</p>
      </div>
      <div className="grid grid-cols-2 gap-3">
        <div><label className={labelCls}>Phone <span className="text-gray-400 font-normal">(optional)</span></label><input type="text" value={phone} onChange={e=>setPhone(e.target.value)} disabled={loading} className={inputCls}/></div>
        {role==='officer'&&<div><label className={labelCls}>Department</label><input type="text" value={department} onChange={e=>setDepartment(e.target.value)} disabled={loading} placeholder="e.g., PWD" className={inputCls}/></div>}
      </div>
      {role==='officer'&&<div>
        <label className={labelCls}>Officer Signup Code <span className="text-red-400">*</span></label>
        <input type="text" required value={officerCode} onChange={e=>setOfficerCode(e.target.value)} disabled={loading} className={inputCls}/>
        <p className="mt-1 text-xs text-gray-400">Ask your administrator for this code.</p>
      </div>}
      <button type="submit" disabled={loading} className="w-full py-3 bg-navy-800 text-white font-display font-bold rounded-xl hover:bg-navy-700 disabled:bg-gray-200 disabled:text-gray-400 disabled:hover:bg-gray-200 transition-all">{loading?'Creating account…':'Create Account'}</button>
    </form>
    {googleEnabled&&<><GoogleSeparator/><GoogleButton role={role} officerCode={officerCode}/></>}
    <p className="text-center text-sm text-gray-500 mt-6">Already have an account? <button type="button" onClick={()=>onNavigate('login')} className="text-saffron-600 font-semibold hover:underline">Sign in</button></p>
    <p className="text-center text-xs text-gray-400 mt-2"><button type="button" onClick={()=>onNavigate('submit')} className="hover:underline">Continue as guest instead</button></p>
  </AuthCard>;
}

/* ===== HEADER ===== */
function navItemsFor(user){
  // Officers review and route complaints — they don't file their own, so no Submit tab for them.
  if(user?.role==='officer')return[{k:'dashboard',icon:'fa-chart-pie',l:'Dashboard'}];
  const items=[{k:'submit',icon:'fa-pen-to-square',l:'Submit'}];
  if(user?.role==='citizen')items.push({k:'mytickets',icon:'fa-list-check',l:'My Complaints'});
  return items;
}

function ThemeSwitch({dark,onToggle}){
  return<button onClick={onToggle} role="switch" aria-checked={dark} title={dark?'Switch to light mode':'Switch to dark mode'} aria-label="Toggle dark mode"
    className={`relative w-14 h-7 rounded-full flex-shrink-0 flex items-center px-[3px] transition-colors duration-300 border ${dark?'bg-navy-950 border-white/10':'bg-white/15 border-white/20'} hover:brightness-110`}>
    <i className="fas fa-sun text-saffron-400 text-[10px] absolute left-[6px] transition-opacity duration-300" style={{opacity:dark?0:1}}></i>
    <i className="fas fa-moon text-navy-200 text-[10px] absolute right-[6px] transition-opacity duration-300" style={{opacity:dark?1:0}}></i>
    <span className={`w-5 h-5 rounded-full bg-white shadow-md flex items-center justify-center transition-transform duration-300 ease-out ${dark?'translate-x-7':'translate-x-0'}`}>
      <i className={`fas ${dark?'fa-moon text-navy-700':'fa-sun text-saffron-500'} text-[9px]`}></i>
    </span>
  </button>;
}

function Header({activeTab,setActiveTab,user,authChecked,onLogout,dark,onToggleDark}){
  const navItems=navItemsFor(user);
  return<header className="header-bg text-white shadow-2xl sticky top-0 z-40">
    <div className="max-w-7xl mx-auto px-4">
      <div className="flex items-center justify-between h-16">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl bg-saffron-500 flex items-center justify-center shadow-lg shadow-saffron-500/20"><i className="fas fa-landmark text-white"></i></div>
          <div><h1 className="font-display font-extrabold text-lg leading-tight tracking-tight">Nagarik Mitra</h1><p className="text-[10px] text-navy-300 font-medium tracking-wide">Civic Grievance Classification &amp; Routing</p></div>
        </div>
        <nav className="hidden sm:flex items-center gap-1 bg-white/10 backdrop-blur rounded-lg p-1">
          {navItems.map(t=>
            <button key={t.k} onClick={()=>setActiveTab(t.k)} className={`px-4 py-2 rounded-md text-xs font-bold transition-all flex items-center gap-2 ${activeTab===t.k?'bg-saffron-500 text-white shadow-lg shadow-saffron-500/30':'text-navy-200 hover:text-white hover:bg-white/10'}`}><i className={`fas ${t.icon}`}></i><span className="hidden md:inline">{t.l}</span></button>
          )}
        </nav>
        <div className="flex items-center gap-2 sm:gap-3">
          <div className="hidden lg:flex items-center gap-1.5 bg-white/10 backdrop-blur px-3 py-1.5 rounded-full"><i className="fas fa-bolt text-saffron-400 text-xs"></i><span className="text-[10px] font-bold text-navy-200 tracking-wide">ML POWERED</span></div>
          <ThemeSwitch dark={dark} onToggle={onToggleDark}/>
          {authChecked&&(user?
            <div className="flex items-center gap-2">
              <div className="hidden sm:flex items-center gap-2 bg-white/10 backdrop-blur rounded-full pl-1 pr-3 py-1">
                <div className="w-6 h-6 rounded-full bg-saffron-500 flex items-center justify-center text-[10px] font-bold flex-shrink-0">{(user.full_name||'?')[0].toUpperCase()}</div>
                <span className="text-xs font-semibold max-w-[120px] truncate">{user.full_name}</span>
                <span className="text-[9px] uppercase tracking-wide text-navy-300">{user.role}</span>
              </div>
              <button onClick={onLogout} title="Logout" className="w-9 h-9 rounded-lg bg-white/10 hover:bg-white/20 flex items-center justify-center transition"><i className="fas fa-right-from-bracket text-sm"></i></button>
            </div>
            :<div className="flex items-center gap-2">
              <button onClick={()=>setActiveTab('login')} className="text-xs font-bold px-3 py-2 rounded-lg text-navy-200 hover:text-white hover:bg-white/10 transition">Sign in</button>
              <button onClick={()=>setActiveTab('register')} className="text-xs font-bold px-3 py-2 rounded-lg bg-saffron-500 text-white hover:bg-saffron-600 transition">Register</button>
            </div>
          )}
        </div>
      </div>
      <div className="sm:hidden flex items-center gap-1 bg-white/10 backdrop-blur rounded-lg p-1 mb-3">
        {navItems.map(t=>
          <button key={t.k} onClick={()=>setActiveTab(t.k)} className={`flex-1 px-3 py-2 rounded-md text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${activeTab===t.k?'bg-saffron-500 text-white shadow':'text-navy-200'}`}><i className={`fas ${t.icon}`}></i>{t.l}</button>
        )}
        {user&&<div className="px-3 py-2 text-[10px] text-navy-300 flex items-center gap-1"><i className="fas fa-user text-[9px]"></i>{user.full_name}</div>}
      </div>
    </div>
  </header>;
}

/* ===== FOOTER ===== */
function SiteFooter(){
  return<footer className="relative mt-auto">
    <div className="border-t border-gray-200 dark:border-white/10 bg-[#F0F3F8] dark:bg-navy-950 transition-colors">
      <div className="max-w-7xl mx-auto px-4 sm:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-center">
        <div className="flex items-center gap-2 text-[11px] sm:text-xs font-medium text-navy-600 dark:text-navy-200">
          <span>Government</span><span className="text-saffron-400">|</span><span>Citizens</span><span className="text-saffron-400">|</span><span>Smarter Cities</span>
        </div>
        <span className="font-display font-semibold text-[11px] sm:text-xs text-navy-800 dark:text-white">Nagarik Mitra v3.0<span className="mx-1.5 text-saffron-400">|</span>Making Cities More Livable, Together</span>
        <div className="flex items-center gap-2 text-[11px] sm:text-xs font-medium text-navy-600 dark:text-navy-200">
          <span>Privacy</span><span className="text-saffron-400">|</span><span>Terms</span><span className="text-saffron-400">|</span><span>Help</span>
        </div>
      </div>
    </div>
    <div className="w-full h-28 sm:h-36 lg:h-44 xl:h-52 bg-[#F0F3F8] dark:bg-navy-950 transition-colors overflow-hidden">
      <img src="assets/footer-skyline-light.webp" alt="Illustration of a city skyline" className="w-full h-full object-cover object-bottom block dark:hidden"/>
      <img src="assets/footer-skyline-dark.webp" alt="Illustration of a city skyline" className="w-full h-full object-cover object-bottom hidden dark:block"/>
    </div>
  </footer>;
}

/* ===== APP ===== */
function App(){
  const[activeTab,setActiveTab]=useState('submit');
  const[dark,setDark]=useState(()=>{
    try{
      const saved=localStorage.getItem('nm-theme');
      if(saved)return saved==='dark';
      return window.matchMedia('(prefers-color-scheme: dark)').matches;
    }catch(_){return false;}
  });
  const[user,setUser]=useState(null);
  const[authChecked,setAuthChecked]=useState(false);
  const[googleEnabled,setGoogleEnabled]=useState(false);
  const[authNotice,setAuthNotice]=useState(null);
  const[complaints,setComplaints]=useState([]);
  const[loadingComplaints,setLoadingComplaints]=useState(false);
  const[myTickets,setMyTickets]=useState([]);
  const[loadingMyTickets,setLoadingMyTickets]=useState(false);
  const[apiError,setApiError]=useState(null);

  const refreshMe=useCallback(async()=>{
    try{
      const u=await apiMe();
      setUser(u);
      // Officers land on the dashboard, not the (citizen-only) submit form.
      if(u.role==='officer')setActiveTab(t=>t==='submit'?'dashboard':t);
    }catch(e){
      setUser(null); // 401 just means no session — not an error to show
    }finally{
      setAuthChecked(true);
    }
  },[]);

  useEffect(()=>{
    document.documentElement.classList.toggle('dark',dark);
    try{localStorage.setItem('nm-theme',dark?'dark':'light');}catch(_){}
  },[dark]);

  useEffect(()=>{
    refreshMe();
    apiAuthConfig().then(c=>setGoogleEnabled(!!c.google_enabled)).catch(()=>{});
    // Google OAuth callback redirects here with ?auth_error=... on failure.
    const params=new URLSearchParams(window.location.search);
    const err=params.get('auth_error');
    if(err){
      setAuthNotice(err);
      params.delete('auth_error');
      const qs=params.toString();
      window.history.replaceState({},'',window.location.pathname+(qs?`?${qs}`:''));
    }
  },[refreshMe]);

  const fetchComplaints=useCallback(async()=>{
    try{
      const data=await apiListTickets();
      setComplaints(data);
      setApiError(null);
    }catch(e){
      setApiError(e.message||'Could not reach the Nagarik Mitra API.');
    }finally{
      setLoadingComplaints(false);
    }
  },[]);

  const fetchMyTickets=useCallback(async()=>{
    try{
      setMyTickets(await apiMyTickets());
    }catch(e){
      // logged out mid-session or similar — ignore quietly, /auth/me will catch it
    }finally{
      setLoadingMyTickets(false);
    }
  },[]);

  useEffect(()=>{
    if(user?.role==='officer'){
      setLoadingComplaints(true);
      fetchComplaints();
      const iv=setInterval(fetchComplaints,15000);
      return()=>clearInterval(iv);
    }
  },[user,fetchComplaints]);

  useEffect(()=>{
    if(user?.role==='citizen'){
      setLoadingMyTickets(true);
      fetchMyTickets();
    }
  },[user,fetchMyTickets]);

  const handleAuthed=u=>{
    setUser(u);
    setActiveTab(u.role==='officer'?'dashboard':'submit');
  };

  const handleSubmitted=()=>{
    if(user?.role==='officer')fetchComplaints();
    if(user?.role==='citizen')fetchMyTickets();
  };

  const handleLogout=async()=>{
    try{await apiLogout();}catch(e){/* clearing client state either way */}
    setUser(null);
    setComplaints([]);
    setMyTickets([]);
    setActiveTab('submit');
  };

  return<div className="min-h-screen flex flex-col">
    <Header activeTab={activeTab} setActiveTab={setActiveTab} user={user} authChecked={authChecked} onLogout={handleLogout} dark={dark} onToggleDark={()=>setDark(d=>!d)}/>
    {authNotice&&<div className="max-w-7xl mx-auto w-full px-4 pt-4"><ErrorBanner message={authNotice}/></div>}
    {apiError&&user?.role==='officer'&&<div className="max-w-7xl mx-auto w-full px-4 pt-4"><ErrorBanner message={`${apiError} Start it with: bash scripts/run_api.sh`}/></div>}
    {(activeTab==='login'||activeTab==='register')?
      <main className="flex-1 w-full grid lg:grid-cols-2">
        <AuthHero/>
        <div className="relative flex items-center justify-center px-4 py-10 sm:py-16 dot-bg overflow-hidden">
          <div className="absolute top-10 right-10 w-64 h-64 rounded-full bg-saffron-200/30 dark:bg-saffron-500/10 blur-3xl pointer-events-none"></div>
          <div className="absolute bottom-10 left-10 w-72 h-72 rounded-full bg-navy-300/20 dark:bg-navy-500/10 blur-3xl pointer-events-none"></div>
          <div className="relative w-full max-w-md">
            {activeTab==='login'?<LoginPage googleEnabled={googleEnabled} onAuthed={handleAuthed} onNavigate={setActiveTab}/>:<RegisterPage googleEnabled={googleEnabled} onAuthed={handleAuthed} onNavigate={setActiveTab}/>}
          </div>
        </div>
      </main>
      :<main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
        {activeTab==='submit'&&user?.role!=='officer'&&<SubmitView user={user} onSubmitted={handleSubmitted} onNavigate={setActiveTab}/>}
        {activeTab==='dashboard'&&<DashboardView user={user} complaints={complaints} loading={loadingComplaints} onChanged={fetchComplaints}/>}
        {activeTab==='mytickets'&&<MyTicketsView user={user} tickets={myTickets} loading={loadingMyTickets} onChanged={fetchMyTickets}/>}
      </main>
    }
    <SiteFooter/>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
